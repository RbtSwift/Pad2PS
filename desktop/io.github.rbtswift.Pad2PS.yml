app-id: io.github.rbtswift.Pad2PS
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pad2ps
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --filesystem=/sys:ro
  - --talk-name=org.freedesktop.UPower
modules:
  - name: pad2ps
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opt/Pad2PS /app/bin
      - cp -a linux-unpacked/. /app/opt/Pad2PS/
      - chmod 755 /app/opt/Pad2PS/pad2ps
      - install -Dm755 pad2ps-flatpak.sh /app/bin/pad2ps
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.rbtswift.Pad2PS.png
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.rbtswift.Pad2PS.png
      - install -Dm644 io.github.rbtswift.Pad2PS.desktop /app/share/applications/io.github.rbtswift.Pad2PS.desktop
      - install -Dm644 io.github.rbtswift.Pad2PS.metainfo.xml /app/share/metainfo/io.github.rbtswift.Pad2PS.metainfo.xml
    sources:
      - type: dir
        path: release/linux-unpacked
        dest: linux-unpacked
      - type: file
        path: pad2ps-flatpak.sh
      - type: file
        path: icon-256.png
      - type: file
        path: icon.png
      - type: file
        path: io.github.rbtswift.Pad2PS.desktop
      - type: file
        path: io.github.rbtswift.Pad2PS.metainfo.xml

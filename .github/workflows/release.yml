name: Release Multiplataforma Pad2PS (Desktop & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release à qual o Flatpak será anexado
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    if: ${{ github.event_name == 'push' }}
    name: Desktop Linux (.AppImage, .deb, .rpm, .tar.gz, .flatpak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar rpm
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Compilar Web + AppImage
        run: |
          npm ci
          npm run build
          cd desktop
          npm ci
          npm run prepare-web
          npx electron-builder --linux AppImage deb rpm --publish never
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Empacotar .deb, .rpm e .tar.gz
        working-directory: desktop
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifacts
          cp release/*.AppImage "artifacts/Pad2PS-${VERSION}-x86_64.AppImage"
          chmod +x "artifacts/Pad2PS-${VERSION}-x86_64.AppImage"
          tar -czf "artifacts/Pad2PS-${VERSION}-x86_64.tar.gz" -C release linux-unpacked
          cp release/*.deb "artifacts/Pad2PS-${VERSION}-amd64.deb"
          cp release/*.rpm "artifacts/Pad2PS-${VERSION}-x86_64.rpm"
      - name: Construir bundle Flatpak
        working-directory: desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          VERSION=$(node -p "require('./package.json').version")
          SOURCE="Pad2PS-${VERSION}-x86_64.tar.gz"
          SOURCE_SHA=$(sha256sum "artifacts/${SOURCE}" | cut -d' ' -f1)
          cp io.github.rbtswift.Pad2PS.yml flatpak-ci.yml
          python3 - "$SOURCE" "$SOURCE_SHA" <<'PY'
          import pathlib
          import re
          import sys

          source, checksum = sys.argv[1:]
          manifest = pathlib.Path("flatpak-ci.yml")
          content = manifest.read_text()
          content, url_count = re.subn(
              r"(?m)^(\s*url:\s*).+Pad2PS-[^\s]+-x86_64\.tar\.gz\s*$",
              rf"\g<1>file://{pathlib.Path('artifacts', source).resolve()}",
              content,
              count=1,
          )
          content, checksum_count = re.subn(
              r"(?m)^(\s*sha256:\s*)[0-9a-f]{64}\s*$",
              rf"\g<1>{checksum}",
              content,
              count=1,
          )
          if url_count != 1 or checksum_count != 1:
              raise SystemExit("Unable to prepare the Flatpak source manifest")
          manifest.write_text(content)
          PY
          flatpak-builder --user --force-clean --default-branch=stable --repo=flatpak_repo flatpak_build flatpak-ci.yml
          flatpak build-bundle --user --arch=x86_64 flatpak_repo "artifacts/Pad2PS-${VERSION}-x86_64.flatpak" io.github.rbtswift.Pad2PS stable
          rm flatpak-ci.yml
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: desktop/artifacts/*

  build-flatpak-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Build and attach Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate release manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          python3 - "desktop/io.github.rbtswift.Pad2PS.yml" "$RELEASE_TAG" "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          manifest, tag, version = sys.argv[1:]
          content = pathlib.Path(manifest).read_text()
          expected_url = (
              f"https://github.com/RbtSwift/Pad2PS/releases/download/{tag}/"
              f"Pad2PS-{version}-x86_64.tar.gz"
          )
          if expected_url not in content or not re.search(
              r"(?m)^\s+sha256:\s*[0-9a-f]{64}\s*$", content
          ):
              raise SystemExit(
                  f"Manifest is not pinned to the release tarball for {tag}"
              )
          PY
      - name: Build and upload Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          VERSION="${RELEASE_TAG#v}"
          mkdir -p artifacts
          flatpak-builder --user --force-clean --default-branch=stable --repo=flatpak_repo flatpak_build desktop/io.github.rbtswift.Pad2PS.yml
          flatpak build-bundle --user --arch=x86_64 flatpak_repo "artifacts/Pad2PS-${VERSION}-x86_64.flatpak" io.github.rbtswift.Pad2PS stable
          gh release upload "$RELEASE_TAG" "artifacts/Pad2PS-${VERSION}-x86_64.flatpak" --clobber

  build-windows:
    if: ${{ github.event_name == 'push' }}
    name: Desktop Windows (.exe Setup & Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar Web + Windows
        run: |
          npm ci
          npm run build
          cd desktop
          npm ci
          npm run prepare-web
          npx electron-builder --win nsis portable --publish never
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            desktop/release/*Setup*.exe
            desktop/release/*Portable*.exe

  build-android:
    if: ${{ github.event_name == 'push' && vars.ANDROID_SIGNING_ENABLED == 'true' }}
    name: Android (.apk & .aab)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compilar Web + Android
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/android/app/signing.keystore
          fi
          npm ci
          npm run build
          cd android
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/*.apk "../artifacts/Pad2PS-Android.apk"
          cp app/build/outputs/bundle/release/*.aab "../artifacts/Pad2PS-Android.aab"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android/artifacts/*

  publish-release:
    if: ${{ github.event_name == 'push' && always() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') }}
    name: Publicar GitHub Release
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true
      - name: Gerar índices APT e publicar no Pages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg
          cd "$GITHUB_WORKSPACE/all-artifacts"
          RELEASE_TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${RELEASE_TAG#v}"
          python3 ../.github/scripts/generate_debian_changelog.py "${VERSION}" ../RELEASE_NOTES.md pad2ps_${VERSION}.txt
          mkdir -p ../pages/apt/changelogs
          cp pad2ps_${VERSION}.txt ../pages/apt/changelogs/
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
            GPG_FINGERPRINT=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')
          fi
          dpkg-scanpackages -m . /dev/null | sed 's#Filename: ./#Filename: #' > Packages
          gzip -n -9 -c Packages > Packages.gz
          PACKAGES_SHA=$(sha256sum Packages | cut -d' ' -f1)
          PACKAGES_SIZE=$(wc -c < Packages)
          GZIP_SHA=$(sha256sum Packages.gz | cut -d' ' -f1)
          GZIP_SIZE=$(wc -c < Packages.gz)
          cat > Release <<EOF
          Origin: RbtSwift Pad2PS
          Label: RbtSwift Pad2PS
          Suite: stable
          Version: ${VERSION}
          Codename: stable
          Date: $(date -Ru)
          Architectures: amd64
          Components: main
          Description: Official Pad2PS APT repository
          Changelogs: https://rbtswift.github.io/Pad2PS/apt/changelogs/@CHANGEPATH@
          Acquire-By-Hash: no
          SHA256:
           ${PACKAGES_SHA} ${PACKAGES_SIZE} Packages
           ${GZIP_SHA} ${GZIP_SIZE} Packages.gz
          EOF
          mkdir -p ../pages/apt
          cp Packages Packages.gz Release ../pages/apt/
          if [ -n "${GPG_PRIVATE_KEY:-}" ] && [ -n "${GPG_FINGERPRINT:-}" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign --default-key "$GPG_FINGERPRINT" -o ../pages/apt/Release.gpg ../pages/apt/Release
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --default-key "$GPG_FINGERPRINT" --clearsign -o ../pages/apt/InRelease ../pages/apt/Release
          fi
          git -C ../pages config user.name "github-actions[bot]"
          git -C ../pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ../pages add apt
          git -C ../pages commit -m "Update APT index for v${VERSION}"
          git -C ../pages push origin gh-pages
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: all-artifacts/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
